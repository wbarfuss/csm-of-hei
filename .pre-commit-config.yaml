#   rev: 2.2.10
#   hooks:
#   - id: nbdev_clean
repos:
  - repo: https://github.com/srstevenson/nb-clean
    rev: 4.0.1
    hooks:
      - id: nb-clean
        args:
          - --remove-all-notebook-metadata
          - --remove-empty-cells
          - --preserve-cell-outputs
          - --preserve-cell-metadata
          - tags
          - slideshow
          - --
  - repo: local
    hooks:
      - id: strip-png-metadata
        name: strip PNG metadata and widget ids from notebook outputs
        entry: python3 tools/strip_nb_png_metadata.py
        language: system
        files: \.ipynb$
      - id: shrink-drawio-png
        name: re-export draw.io PNGs wider than 2000 px
        entry: python3 tools/shrink_drawio_png.py
        language: system
        files: \.(dio|drawio)\.png$
      - id: forbid-generated
        name: forbid PDFs, draw.io backups and build folders
        entry: generated files must not be committed (see CONTRIBUTING.md)
        language: fail
        files: (\.pdf|\.bkp)$|^__(output|scripts|slides)/
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=3000]
      - id: check-merge-conflict